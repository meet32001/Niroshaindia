name: Dispatch Weekly High-Ticket VIP Newsletter

on:
  schedule:
    - cron: '30 3 * * 1' # Every Monday at 09:00 AM IST (03:30 AM UTC)
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  broadcast:
    name: Curate Deals & Dispatch VIP Broadcast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Weekly Deals Dispatcher
        run: npx tsx scripts/dispatch-weekly-deals.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: "https://niroshaindia.com"
